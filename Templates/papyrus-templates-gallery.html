<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Papyrus — Galerie de modèles (50)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#052139; --cyan:#2AC2DE; --amber:#F6923E; --electric:#3C5EAB;
  --ice:#EFF9FE; --sky:#C7EAFB; --coral:#E5646E;
  --bg:#03192B; --panel:rgba(239,249,254,.045); --panel2:rgba(239,249,254,.07);
  --line:rgba(199,234,251,.14); --line2:rgba(199,234,251,.26);
  --txt:#EAF6FD; --txt2:rgba(234,246,253,.66); --txt3:rgba(234,246,253,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--txt);
  font-family:'DM Sans',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 520px at 12% -8%, rgba(42,194,222,.14), transparent 62%),
    radial-gradient(760px 480px at 92% 4%, rgba(60,94,171,.20), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:'Syne',sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.15}
code,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}
.glass{background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:20px}

/* header */
header{padding:52px 0 28px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);font-weight:700}
h1{font-size:clamp(30px,4.4vw,50px);margin:10px 0 12px}
.sub{color:var(--txt2);max-width:70ch;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-top:28px}
.stat{padding:16px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.stat b{font-family:'Syne';font-size:27px;display:block;line-height:1}
.stat span{font-size:11.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em}
.stat.ok b{color:var(--cyan)} .stat.warn b{color:var(--amber)} .stat.no b{color:var(--coral)}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:40;padding:14px 0;margin:26px 0 22px;
  background:rgba(3,25,43,.86);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.tbrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=search]{flex:1;min-width:210px;height:40px;padding:0 14px;border-radius:11px;
  background:var(--panel2);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:14px}
input[type=search]:focus{outline:none;border-color:var(--cyan)}
input[type=search]::placeholder{color:var(--txt3)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:var(--txt2);font:inherit;font-size:13px;font-weight:500;
  padding:6px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--cyan);color:var(--navy);font-weight:700}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.pill{background:var(--panel2);border:1px solid var(--line);color:var(--txt2);font:inherit;font-size:12.5px;
  padding:5.5px 13px;border-radius:999px;cursor:pointer;transition:.14s}
.pill:hover{border-color:var(--line2);color:var(--txt)}
.pill.on{background:var(--ice);color:var(--navy);border-color:var(--ice);font-weight:600}
.pill i{font-style:normal;opacity:.5;margin-left:5px;font-size:11px}

/* grid */
.count{color:var(--txt3);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;padding-bottom:70px}
.card{padding:20px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;text-align:left;
  font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:20px}
.card:hover{border-color:var(--line2);background:var(--panel2);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.ic{width:38px;height:38px;border-radius:11px;background:rgba(42,194,222,.13);border:1px solid rgba(42,194,222,.26);
  display:grid;place-items:center;flex:none}
.ic svg{width:19px;height:19px;stroke:var(--cyan);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card.d .ic{background:rgba(246,146,62,.13);border-color:rgba(246,146,62,.28)} .card.d .ic svg{stroke:var(--amber)}
.card.b .ic{background:rgba(229,100,110,.13);border-color:rgba(229,100,110,.3)} .card.b .ic svg{stroke:var(--coral)}
.badge{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.badge.r{background:rgba(42,194,222,.15);color:var(--cyan)}
.badge.d{background:rgba(246,146,62,.16);color:var(--amber)}
.badge.b{background:rgba(229,100,110,.16);color:var(--coral)}
.card h3{font-size:16.5px;margin-bottom:6px}
.card p{color:var(--txt2);font-size:13px;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.tag{font-size:10.5px;padding:3px 8px;border-radius:6px;background:rgba(199,234,251,.08);color:var(--txt3);
  border:1px solid rgba(199,234,251,.09)}
.tag.hi{background:rgba(60,94,171,.28);color:#B9CCF2;border-color:rgba(60,94,171,.4)}
.cat{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px;font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(2,14,24,.72);backdrop-filter:blur(4px);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);z-index:70;overflow-y:auto;
  background:#061F35;border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1)}
.drawer.on{transform:none}
.dhead{position:sticky;top:0;background:rgba(6,31,53,.96);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:22px 26px;z-index:2}
.dhead h2{font-size:23px;margin:8px 0 7px}
.dbody{padding:24px 26px 90px}
.close{position:absolute;top:20px;right:22px;width:32px;height:32px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);color:var(--txt2);cursor:pointer;font-size:17px;line-height:1}
.close:hover{color:var(--txt);border-color:var(--line2)}
.note{padding:12px 15px;border-radius:12px;font-size:13px;margin-bottom:20px;line-height:1.5}
.note.d{background:rgba(246,146,62,.1);border:1px solid rgba(246,146,62,.3);color:#FBD3AC}
.note.b{background:rgba(229,100,110,.1);border:1px solid rgba(229,100,110,.3);color:#F5BEC2}
.sect{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3);font-weight:700;
  margin:26px 0 11px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.sect:first-child{margin-top:0}
.pg{display:flex;align-items:center;gap:10px;margin:20px 0 11px}
.pg span{font-family:'Syne';font-weight:700;font-size:13.5px;color:var(--sky)}
.pg .ln{flex:1;height:1px;background:var(--line)}
.f{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(199,234,251,.07)}
.f:last-child{border:0}
.fn{font-family:'JetBrains Mono';font-size:10.5px;color:var(--txt3);width:26px;flex:none;padding-top:3px}
.fb{flex:1;min-width:0}
.ft{display:inline-block;font-family:'JetBrains Mono';font-size:10px;padding:2.5px 7px;border-radius:5px;
  background:rgba(60,94,171,.3);color:#BACDF3;margin-bottom:5px}
.ft.med{background:rgba(42,194,222,.18);color:var(--cyan)}
.req{color:var(--coral);font-weight:700;margin-left:4px}
.fl{font-size:14px;font-weight:500}
.fen{font-size:12.5px;color:var(--txt3);font-style:italic;margin-top:2px}
.fd{font-size:12.5px;color:var(--txt2);margin-top:4px}
.opts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.opt{font-size:11.5px;padding:3px 9px;border-radius:6px;background:rgba(199,234,251,.07);
  border:1px solid rgba(199,234,251,.1);color:var(--txt2)}
.opt b{color:var(--cyan);font-family:'JetBrains Mono';font-size:10px;margin-left:5px}
.vd{font-family:'JetBrains Mono';font-size:10.5px;color:var(--txt3);margin-top:7px;word-break:break-all}
table{width:100%;border-collapse:collapse;margin-top:9px;font-size:11.5px}
th,td{padding:6px 8px;border:1px solid var(--line);text-align:left}
th{background:rgba(199,234,251,.05);color:var(--txt3);font-weight:600;font-size:10.5px}
.rule{padding:11px 14px;border-radius:11px;background:rgba(60,94,171,.13);border:1px solid rgba(60,94,171,.3);
  margin-bottom:8px;font-size:12.5px;line-height:1.6}
.rule code{background:rgba(3,25,43,.6);padding:1.5px 6px;border-radius:4px;font-size:11px;color:var(--sky)}
.empty{text-align:center;padding:70px 20px;color:var(--txt3)}
@media(max-width:640px){.wrap{padding:0 16px}.stats{grid-template-columns:repeat(2,1fr)}.dbody,.dhead{padding-left:18px;padding-right:18px}}
</style>
</head>

<header>
  <div class="eyebrow">Papyrus · Mooove</div>
  <h1>Galerie de modèles</h1>

<div class="wrap">

ar"}}], "rows": []}, {"id": "demande-fonctionnalite-f4", "type": "nps", "label": {"fr": "Quelle importance cette fonctionnalité a-t-elle pour vous ?", "en": "How important is this feature to you?"}, "description": {"fr": "0 : simple confort. 10 : je ne peux pas travailler sereinement sans.", "en": "0: nice to have. 10: I cannot work properly without it."}, "placeholder": {"fr": "", "en": ""}, "required": true, "layout_width": "full", "validation": {"min": 0, "max": 10, "nps_left_label": "Simple confort", "nps_right_label": "Totalement bloquant", "display_style": "slider"}, "options": [], "rows": []}, {"id": "demande-fonctionnalite-f5", "type": "image", "label": {"fr": "Une capture d’écran ou une maquette à nous montrer ?", "en": "A screenshot or mockup to show us?"}, "description": {"fr": "Facultatif, mais un croquis même approximatif vaut souvent trois paragraphes. 25 Mo maximum.", "en": "Optional, but even a rough sketch often beats three paragraphs. 25 MB maximum."}, "placeholder": {"fr": "", "en": ""}, "required": false, "layout_width": "full", "validation": {"creator_mode_enabled": false, "respondent_mode_enabled": true, "max_file_size_mb": 25}, "options": [], "rows": []}, {"id": "demande-fonctionnalite-f6", "type": "email", "label": {"fr": "Votre e-mail, pour vous tenir au courant", "en": "Your email, so we can keep you posted"}, "description": {"fr": "Nous vous écrivons uniquement à propos de cette demande.", "en": "We will only write to you about this request."}, "placeholder": {"fr": "prenom@entreprise.mu", "en": "name@company.com"}, "required": true, "layout_width": "full", "validation": {}, "options": [], "rows": []}], "logic_rules": []}, {"id": "tpl-mooove-rapport-bug", "slug": "rapport-bug", "category": "Produit & Recherche", "icon": "Bug", "display_mode": "sections", "feasibility": "ready", "feasibility_note": {"fr": "", "en": ""}, "title": {"fr": "Rapport de bug", "en": "Bug report"}, "description": {"fr": "Un signalement structuré : ce qui s’est pass éponse) reste à développer.", "en": "Papyrus has no signature field, so consent is captured through a typed name and Yes/No choices rather than a drawn signature. For legally robust consent, a `signature` type (canvas capture, timestamp and IP stored with the submission) still needs to be built."}, "title": {"fr": "Consentement RGPD et droit à l’image", "en": "GDPR and image rights consent"}, "description": {"fr": "Recueil du consentement au traitement de vos données personnelles et à l’utilisation de votre image. Chaque usage fait l’objet d’une autorisation distincte, révocable à tout moment.", "en": "Consent collection for the processing of your personal data and the use of your image. Each use is authorised separately and can be withdrawn at any time."}, "template_description": {"fr": "Consentements séparés données, photo, vidéo, réseaux sociaux et print, avec texte d’information complet.", "en": "Separate consents for data, photo, video, social media and print, with a full information notice."}, "scoring_enabled": false, "show_score_to_respondent": false, "settings": {"progress_bar": true}, "fields": [{"id": "consentement-rgpd-image-f1", "type": "section_break", "label": {"fr": "Vous identifier", "en": "Identify yourself"}, "description": {"fr": "", "en": ""}, "placeholder": {"fr": "", "en": ""}, "required": false, "layout_width": "full", "validation": {}, "options": [], "rows": []}, {"id": "consentement-rgpd-image-f2", "type": "short_text", "label": {"fr": "Nom et prénom", "en": "Full name"}, "description": {"fr": "", "en": ""}, "placeholder": {"fr": "", "en": ""}, "required": true, "layout_width": "full", "validation": {"max": 80}, "options": [], "rows": []}, {"id": "consentement-rgpd-image-f3", "type": "date", "label": {"fr": "Date de naissance", "en": "Date of birth"}, "description": {"fr": "Pour une personne mineure, le consentement doit être donné par le représentant légal.", "en": "For a minor, consent must be given by the legal guardian."}, "placeholder": {"fr": "", "en": ""}, "required": true, "layout_width": "half", "validation": {}, "options": [], "rows": []}, {"id": "consentement-rgpd-image-f4", "type": "email", "label": {"fr": "Adresse e-mail", "en": "Email address"}, "description": {"fr": "", "en": ""}, "placeholder": {"fr": "", "en": ""}, "required": true, "layout_width": "half", "validation": {}, "options": [], "rows": []}, {"id": "consentement-rgpd-image-f5", "type": "section_break", "label": {"fr": "Le consentement", "en": "Your consent"}, "description": {"fr": "", "en": ""}, "placeholder": {"fr": "", "en": ""}, "required": false, "layout_width": "full", "validation": {}, "options": [], "rows": []}, {"id": "consentement-rgpd-image-f6", "type": "statement", "label": {"fr": "Information sur le traitement de vos données et de votre image", "en": "Information about the processing of your data and your image"}, "description": {"fr": "Responsable du traitement : [Nom de l’organisation], [adresse complète], joignable à [adresse e-mail de contact]. Finalités : gestion de la relation avec les participants, communication institutionnelle et promotion des activités de l’organisation. Base légale : votre consentement, recueilli usage par usage ci-dessous. Données traitées : nom, prénom, date de naissance, adresse e-mail, ainsi que les photographies et vidéos sur lesquelles vous apparaissez. Destinataires : les services internes chargés de la communication et, le cas échéant, les prestataires techniques d’hébergement et de diffusion, agissant en qualité de sous-traitants. Durée de conservation : trois ans à compter du recueil pour les données d’identification, cinq ans pour les images publiées, sauf retrait antérieur de votre consentement. Vos droits : vous disposez d’un droit d’accès, de rectification, d’effacement, de limitation et d’opposition, ainsi que du droit à la portabilité de vos données. Vous pouvez retirer votre consentement à tout moment, sans avoir à vous justifier ; ce retrait ne remet pas en cause la licéité du traitement effectué avant celui-ci. Pour exercer ces droits, écrivez à l’adresse de contact ci-dessus. Vous pouvez également introduire une réclamation auprès de l’autorité de contrôle compétente.", "en": "Data controller: [Organisation name], [full address], reachable at [contact email address]. Purposes: managing the relationship with participants, institutional communication and promotion of the organisation’s activities. Legal basis: your consent, collected use by use below. Data processed: surname, first name, date of birth, email address, together with the photographs and videos in which you appear. Recipients: the internal communications teams and, where applicable, the technical hosting and distribution providers acting as processors. Retention: three years from collection for identification data, five years for published images, unless you withdraw your consent sooner. Your rights: you have the right of access, rectification, erasure, restriction and objection, as well as the right to data portability. You may withdraw your consent at any time, without justification; withdrawal does not affect the lawfulness of processing carried out beforehand. To exercise these rights, write to the contact address above. You may also lodge a complaint with the competent supervisory authority."}, "placeholder": {"fr": "", "en": ""}, "required": false, "layout_width": "full", "validation": {}, "options": [], "rows": []}, {"id": "consentement-rgpd-image-f7", "type": "single_choice", "label": {"fr": "J’autorise le traitement de mes données personnelles aux finalités décrites ci-dessus", "en": "I authorise the processing of my personal data for the purposes described above"}, "description": {"fr": "", "en": ""}, "placeholder": {"fr": "", "en": ""}, "required": true, "layout_width": "full", "validation": {"display_style": "buttons", "options_columns": 2}, "options": [{"id": "consentement-rgpd-image-f7-o1", "label": {"fr": "Oui, je consens", "en": "Yes, I consent"}}, { =\"M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12\" />", "Smile": "<svg class=\"lucide lucide-smile\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M15 10V9\" /> <path d=\"M16.472 15a6 6 0 01-8.943 0\" /> <path d=\"M9 10V9\" /> <circle cx=\"12\" cy=\"12\" r=\"10\" />", "Sparkles": "<svg class=\"lucide lucide-sparkles\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z\" /> <path d=\"M20 2v4\" /> <path d=\"M22 4h-4\" /> <circle cx=\"4\" cy=\"20\" r=\"2\" />", "Star": "<svg class=\"lucide lucide-star\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z\" />", "Target": "<svg class=\"lucide lucide-target\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <circle cx=\"12\" cy=\"12\" r=\"10\" /> <circle cx=\"12\" cy 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5\" /> <rect x=\"2\" y=\"6\" width=\"14\" height=\"12\" rx=\"2\" />", "BarChart3": "<svg class=\"lucide lucide-bar-chart-3\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M3 3v16a2 2 0 0 0 2 2h16\" /> <path d=\"M18 17V9\" /> <path d=\"M13 17V5\" /> <path d=\"M8 17v-3\" />"}, "catEn": {"Contact & Leads": "Contact & Leads", "RH & Recrutement": "HR & Recruiting", "Vie interne": "Internal / People Ops", "Satisfaction client": "Customer satisfaction", "Produit & Recherche": "Product & Research", "Événements": "Events", "Marketing & Agence": "Marketing & Agency", "Réservations & Voyage": "Bookings & Travel", "Éducation & Quiz": "Education & Quizzes", "Opérations & Conformité": "Operations & Compliance"}}</script>
<script>
const DB = JSON.parse(document.getElementById('data').textContent);
const T = DB.templates, TL = DB.typeLabel, MD = DB.mode, FE = DB.feas, S = DB.stats;
let L = 0, cat = null, feas = 'all', q = '';
const L2 = () => L ? 'en' : 'fr';
const t = (o) => (o && (o[L2()] || o.fr)) || '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const FALLBACK = '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 9h8M8 13h8"/>';
const ico = n => `<span class="ic"><svg viewBox="0 0 24 24">${DB.icons[n]||FALLBACK}</svg></span>`;
const TX = {
 fr:{sub:`${S.total} modèles bilingues FR/EN prêts à intégrer dans Papyrus — ${S.fields} champs, ${S.rules} règles de logique conditionnelle, ${S.scored} formulaires notés. Chaque modèle porte un badge de faisabilité par rapport aux 18 types de champs actuellement disponibles dans l’application.`,
   all:'Toutes',res:'modèle(s)',none:'Aucun modèle ne correspond.',fields:'Structure du formulaire',rules:'Logique conditionnelle',
   scored:'Formulaire noté',page:'Page',rows:'Lignes',cols:'Colonnes',req:'obligatoire',pts:'pts',
   st:['Modèles','Prêts à livrer','Contournés','Bloqués','Champs','Règles logiques']},
 en:{sub:`${S.total} bilingual FR/EN templates ready to ship in Papyrus — ${S.fields} fields, ${S.rules} conditional-logic rules, ${S.scored} scored forms. Each template carries a feasibility badge against the 18 field types the app supports today.`,
   all:'All',res:'template(s)',none:'No template matches.',fields:'Form structure',rules:'Conditional logic',
   scored:'Scored form',page:'Page',rows:'Rows',cols:'Columns',req:'required',pts:'pts',
   st:['Templates','Ready to ship','Workaround','Blocked','Fields','Logic rules']}
};
const X = () => TX[L2()];
const cn = c => L ? (DB.catEn[c] || c) : c;

function chrome(){
  document.getElementById('sub').textContent = X().sub;
  document.getElementById('q').placeholder = L ? 'Search a template, a field, a category…' : 'Rechercher un modèle, un champ, une catégorie…';
  const s = X().st;
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${S.total}</b><span>${s[0]}</span></div>
     <div class="stat ok"><b>${S.ready}</b><span>${s[1]}</span></div>
     <div class="stat warn"><b>${S.degraded}</b><span>${s[2]}</span></div>
     <div class="stat no"><b>${S.blocked}</b><span>${s[3]}</span></div>
     <div class="stat"><b>${S.fields}</b><span>${s[4]}</span></div>
     <div class="stat"><b>${S.rules}</b><span>${s[5]}</span></div>`;
  document.getElementById('feas').innerHTML =
    ['all','ready','degraded','blocked'].map(f=>
      `<button data-f="${f}" class="${feas===f?'on':''}">${f==='all'?X().all:FE[f][L]}</button>`).join('');
  document.getElementById('cats').innerHTML =
    `<button class="pill ${cat?'':'on'}" data-c="">${X().all}<i>${T.length}</i></button>` +
    DB.cats.map(c=>`<button class="pill ${cat===c?'on':''}" data-c="${esc(c)}">${esc(cn(c))}<i>${T.filter(x=>x.category===c).length}</i></button>`).join('');
}

function match(x){
  if(cat && x.category!==cat) return false;
  if(feas!=='all' && x.feasibility!==feas) return false;
  if(!q) return true;
  const h = [x.title.fr,x.title.en,x.template_description.fr,x.template_description.en,x.category,x.slug,
             ...x.fields.map(f=>f.label.fr+' '+f.label.en+' '+f.type)].join(' ').toLowerCase();
  return h.includes(q);
}

function render(){
  chrome();
  const list = T.filter(match);
  document.getElementById('count').textContent = `${list.length} ${X().res}`;
  document.getElementById('grid').innerHTML = list.length ? list.map((x,i)=>{
    const k = x.feasibility==='ready'?'r':x.feasibility==='degraded'?'d':'b';
    const n = x.fields.filter(f=>f.type!=='section_break').length;
    const pages = x.fields.filter(f=>f.type==='section_break').length;
    const tags = [`<span class="tag">${n} ${L?'fields':'champs'}</span>`,
      `<span class="tag">${MD[x.display_mode][L]}${pages?' · '+pages+' '+(L?'pages':'pages'):''}</span>`];
    if(x.logic_rules.length) tags.push(`<span class="tag hi">${x.logic_rules.length} ${L?'logic':'logique'}</span>`);
    if(x.scoring_enabled) tags.push(`<span class="tag hi">${L?'Scored':'Noté'}</span>`);
    if(x.fields.some(f=>f.type==='matrix')) tags.push(`<span class="tag">Matrix</span>`);
    if(x.fields.some(f=>f.type==='video'||f.type==='image')) tags.push(`<span class="tag">${L?'Media':'Média'}</span>`);
    return `<button class="card ${k}" data-i="${T.indexOf(x)}">
      <div class="top">${ico(x.icon)}
        <span class="badge ${k}">${FE[x.feasibility][L]}</span></div>
      <div class="cat">${esc(cn(x.category))}</div>
      <h3>${esc(t(x.title))}</h3>
      <p>${esc(t(x.template_description))}</p>
      <div class="meta">${tags.join('')}</div></button>`;
  }).join('') : `<div class="empty" style="grid-column:1/-1">${X().none}</div>`;
}

function fieldHTML(f,n){
  const media = ['image','video','statement','file'].includes(f.type);
  let o = '';
  if(f.type==='matrix'){
    o = `<table><tr><th>${X().rows} \\ ${X().cols}</th>${f.options.map(c=>`<th>${esc(t(c.label))}${c.points!==undefined?` <b style="color:#2AC2DE">${c.points}</b>`:''}</th>`).join('')}</tr>` +
        f.rows.map(r=>`<tr><td>${esc(t(r.label))}</td>${f.options.map(()=>'<td></td>').join('')}</tr>`).join('') + `</table>`;
  } else if(f.options.length){
    o = `<div class="opts">${f.options.map(x=>`<span class="opt">${esc(t(x.label))}${x.points!==undefined?`<b>${x.points} ${X().pts}</b>`:''}</span>`).join('')}</div>`;
  }
  const v = Object.keys(f.validation).length ? `<div class="vd">${esc(JSON.stringify(f.validation))}</div>` : '';
  const other = t(f.label) === (f.label.fr||'') ? f.label.en : f.label.fr;
  return `<div class="f"><div class="fn">${n}</div><div class="fb">
    <span class="ft ${media?'med':''}">${TL[f.type][L]}</span>${f.layout_width==='half'?'<span class="ft" style="margin-left:5px;background:rgba(199,234,251,.08);color:rgba(234,246,253,.42)">½</span>':''}
    <div class="fl">${esc(t(f.label))}${f.required?`<span class="req" title="${X().req}">*</span>`:''}</div>
    ${other&&other!==t(f.label)?`<div class="fen">${esc(other)}</div>`:''}
    ${t(f.description)?`<div class="fd">${esc(t(f.description))}</div>`:''}
    ${o}${v}</div></div>`;
}

function open_(i){
  const x = T[i], k = x.feasibility==='ready'?'r':x.feasibility==='degraded'?'d':'b';
  const byId = Object.fromEntries(x.fields.map(f=>[f.id,f]));
  let body='', n=0, first=true;
  for(const f of x.fields){
    if(f.type==='section_break'){
      body += `<div class="pg"><span>${X().page} — ${esc(t(f.label))}</span><div class="ln"></div></div>`;
      first=false; continue;
    }
    body += fieldHTML(f, ++n);
  }
  const rules = x.logic_rules.length ? `<div class="sect">${X().rules}</div>` + x.logic_rules.map(r=>{
    const conds = r.conditions.map(c=>{
      const src = byId[c.source_field_id];
      let val = c.value;
      for(const f of x.fields) for(const o of [...f.options,...f.rows]) if(o.id===c.value) val = t(o.label);
      return `<code>${esc(src?t(src.label).slice(0,52):c.source_field_id)}</code> ${c.operator} <code>${esc(val)}</code>`;
    }).join(` <b>${r.conditions_operator}</b> `);
    const tgt = byId[r.target_field_id];
    const act = {show_field:L?'show':'afficher',hide_field:L?'hide':'masquer',jump_to:L?'jump to':'aller à',end_form:L?'end the form':'terminer le formulaire'}[r.action_type];
    return `<div class="rule"><b>${L?'IF':'SI'}</b> ${conds} <b>→</b> ${act}${tgt?` <code>${esc(t(tgt.label).slice(0,52))}</code>`:''}</div>`;
  }).join('') : '';

  document.getElementById('drawer').innerHTML = `
    <div class="dhead">
      <button class="close" id="cl">✕</button>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="badge ${k}">${FE[x.feasibility][L]}</span>
        <span class="tag">${esc(cn(x.category))}</span>
        <span class="tag">${MD[x.display_mode][L]}</span>
        ${x.scoring_enabled?`<span class="tag hi">${X().scored}</span>`:''}
      </div>
      <h2>${esc(t(x.title))}</h2>
      <div class="mono" style="font-size:11px;color:rgba(234,246,253,.42)">${esc(x.id)}</div>
    </div>
    <div class="dbody">
      <p style="color:rgba(234,246,253,.66);font-size:14px;margin-bottom:18px">${esc(t(x.description))}</p>
      ${x.feasibility!=='ready'?`<div class="note ${k}">${esc(t(x.feasibility_note))}</div>`:''}
      <div class="sect">${X().fields} · ${n} ${L?'fields':'champs'}</div>
      ${body}
      ${rules}
    </div>`;
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');
  document.getElementById('drawer').scrollTop = 0;
  document.getElementById('cl').onclick = close_;
}
function close_(){ document.getElementById('drawer').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); }

document.getElementById('grid').addEventListener('click', e=>{
  const c = e.target.closest('.card'); if(c) open_(+c.dataset.i);
});
document.getElementById('scrim').onclick = close_;
document.addEventListener('keydown', e=>{ if(e.key==='Escape') close_(); });
document.getElementById('q').addEventListener('input', e=>{ q = e.target.value.toLowerCase().trim(); render(); });
document.getElementById('lang').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  L = b.dataset.l==='en' ? 1 : 0;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x===b));
  close_(); render();
});
document.getElementById('feas').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return; feas = b.dataset.f; render();
});
document.getElementById('cats').addEventListener('click', e=>{
  const b = e.target.closest('.pill'); if(!b) return; cat = b.dataset.c || null; render();
});
render();
</script>
</body></html>
